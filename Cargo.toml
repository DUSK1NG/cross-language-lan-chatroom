[workspace]
members = ["protocol-rust", "server-rust", "desktop-rust", "crates/client-core", "apps/desktop/src-tauri", "tools/bootstrap"]
exclude = ["android/transport-rust"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
lan-chat-protocol = { path = "protocol-rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
