[package]
name = "lan-chat-client-core"
version = "0.1.0"
edition.workspace = true
rust-version = "1.91"

[dependencies]
anyhow.workspace = true
base64 = "=0.22.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
lan-chat-protocol.workspace = true
lan-chat-transport = { path = "../../desktop-rust" }
mls-rs = "=0.58.0"
mls-rs-crypto-rustcrypto = "=0.24.0"
ring = "=0.17.14"
rustls-pemfile = "=2.2.0"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "net", "process", "rt", "sync", "time"] }
uuid = { version = "=1.26.1", features = ["v4"] }
