name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust-server:
    name: Rust LAN and online server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo +stable test --locked -p lan-chat-protocol -p lan-chat-server --features lan-chat-server/test-hooks
      - run: cargo +stable build --locked --release -p lan-chat-server

  frontend:
    name: React frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Check version consistency
        run: |
          node ../scripts/check-version.mjs
          node --test ../scripts/check-version.test.mjs
      - name: Install, test, and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm exec vitest run
          pnpm run build

  desktop:
    name: Windows desktop host
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/out/rust
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> out/rust
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend run build
      - run: cargo +stable test --locked --workspace --features lan-chat-desktop/desktop-updater,lan-chat-server/test-hooks
      - run: cargo +stable clippy --locked --workspace --all-targets --features lan-chat-desktop/desktop-updater,lan-chat-server/test-hooks -- -D warnings
      - run: ./scripts/package-unified-release.ps1
      - run: ./scripts/package-unified-release.ps1 -Edition online
      - run: ./scripts/package-installer.ps1 -Edition lan -ValidateOnly
      - run: ./scripts/package-installer.ps1 -Edition online -ValidateOnly
      - run: cargo +stable clippy --locked -p lan-chat-desktop --all-targets --features online,desktop-updater -- -D warnings
      - run: node scripts/p10-tls-acceptance.mjs out/desktop/lan-chat-server.exe

  android:
    name: Android debug and Rust JNI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.1' 'ndk;30.0.16248370'
      - run: rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android/transport-rust -> ../app/build/rust-target
      - run: gradle -p android --no-daemon :app:assembleDebug

  source-launcher:
    name: Windows source launcher
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build and validate source package
        shell: pwsh
        run: ./scripts/package-source-launcher.ps1
      - name: Test GUI launcher regression
        shell: pwsh
        run: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\tests\start-gui-wait-regression.ps1
      - name: Parse source launcher scripts
        shell: pwsh
        run: |
          $scripts = @(
            '.\scripts\bootstrap-github.ps1',
            '.\scripts\build-desktop.ps1',
            '.\scripts\package-installer.ps1',
            '.\scripts\package-unified-release.ps1',
            '.\scripts\start-gui.ps1',
            '.\scripts\test-member-package.ps1',
            '.\scripts\tests\start-gui-wait-regression.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parse failed: $script"
            }
          }
