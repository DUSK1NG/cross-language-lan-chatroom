name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Go server
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22.x
      - name: Test and build server
        working-directory: server-go
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
          go build -o chat-server .

  frontend:
    name: React frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install, test, and build
        run: |
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
          pnpm test -- --run
          pnpm run build

  source-launcher:
    name: Windows source launcher
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure launcher
        shell: pwsh
        run: cmake -S .\tools\bootstrap -B .\out\ci-launcher
      - name: Build launcher
        shell: pwsh
        run: cmake --build .\out\ci-launcher --config Release --target LANChat-Launcher --parallel 4
      - name: Test launcher dry run
        shell: pwsh
        run: ctest --test-dir .\out\ci-launcher -C Release --output-on-failure
      - name: Parse source launcher scripts
        shell: pwsh
        run: |
          $scripts = @(
            '.\scripts\bootstrap-github.ps1',
            '.\scripts\build-modern.ps1',
            '.\scripts\install-modern-toolchain.ps1',
            '.\scripts\package-release.ps1',
            '.\scripts\start-gui.ps1',
            '.\scripts\test-member-package.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parse failed: $script"
            }
          }
