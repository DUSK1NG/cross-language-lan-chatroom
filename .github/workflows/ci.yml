name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Go server
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22.x
      - name: Test and build server
        working-directory: server-go
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
          go build -o chat-server .

  frontend:
    name: React frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check version consistency
        run: node ../scripts/check-version.mjs
      - name: Install, test, and build
        run: |
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm test -- --run
          pnpm run build

  cpp-core:
    name: C++ core (headless)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Qt base, OpenSSL and build tools
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libssl-dev cmake ninja-build
      - name: Configure (GUI off)
        run: cmake -S client-cpp/gui -B build/cpp-core -G Ninja -DLAN_CHAT_BUILD_GUI=OFF
      - name: Build
        run: cmake --build build/cpp-core --parallel
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/cpp-core --output-on-failure

  cpp-gui-windows:
    name: C++ GUI (Windows)
    runs-on: windows-latest
    # The Windows GUI build pulls Qt WebEngine (large). Per design D2.4 it runs
    # only on pushes to master and on tags, so PRs stay fast and deterministic
    # on cpp-core.
    #
    # Qt version note: aqtinstall resolves Qt from the official mirror, which
    # does not index every patch release (6.11.2 returns "Failed to locate XML
    # data"). We pin the CI to the current LTS 6.8 line, which aqt serves
    # reliably; the WebEngine/WebChannel API we use is stable across 6.5–6.11,
    # and the headless cpp-core job already compiles the C++ against Qt
    # Core/Network/Test. Local developers may still use 6.11.2 per
    # scripts/install-modern-toolchain.ps1.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Qt (WebEngine)
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.*
          arch: win64_msvc2022_64
          modules: qtwebengine qtwebchannel qtpositioning
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install OpenSSL (choco)
        shell: pwsh
        run: choco install openssl --no-progress -y
      - name: Resolve OpenSSL root
        id: openssl
        shell: pwsh
        run: |
          $candidates = @(
            'C:\Program Files\OpenSSL-Win64',
            'C:\Program Files\OpenSSL'
          )
          $root = $candidates | Where-Object { Test-Path (Join-Path $_ 'include\openssl\ssl.h') } | Select-Object -First 1
          if (-not $root) { throw 'OpenSSL root with include\openssl\ssl.h was not found.' }
          Write-Host "OpenSSL root: $root"
          "root=$root" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Build and test (build-modern.ps1 -Action Test)
        shell: pwsh
        env:
          LAN_CHAT_QT_PREFIX: ${{ env.QT_ROOT_DIR }}
          LAN_CHAT_OPENSSL_ROOT: ${{ steps.openssl.outputs.root }}
          QT_QPA_PLATFORM: offscreen
        run: .\scripts\build-modern.ps1 -Action Test

  source-launcher:
    name: Windows source launcher
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure launcher
        shell: pwsh
        run: cmake -S .\tools\bootstrap -B .\out\ci-launcher
      - name: Build launcher
        shell: pwsh
        run: cmake --build .\out\ci-launcher --config Release --target LANChat-Launcher --parallel 4
      - name: Test launcher dry run
        shell: pwsh
        run: ctest --test-dir .\out\ci-launcher -C Release --output-on-failure
      - name: Test GUI launcher regression
        shell: pwsh
        run: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\tests\start-gui-wait-regression.ps1
      - name: Parse source launcher scripts
        shell: pwsh
        run: |
          $scripts = @(
            '.\scripts\bootstrap-github.ps1',
            '.\scripts\build-modern.ps1',
            '.\scripts\install-modern-toolchain.ps1',
            '.\scripts\package-installer.ps1',
            '.\scripts\package-release.ps1',
            '.\scripts\package-unified-release.ps1',
            '.\scripts\start-gui.ps1',
            '.\scripts\test-member-package.ps1',
            '.\scripts\tests\start-gui-wait-regression.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parse failed: $script"
            }
          }
